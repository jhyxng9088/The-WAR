name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck and build
        run: npm run build

      - name: Upload visual preview artifact
        if: github.event_name == 'push' && startsWith(github.ref_name, 'feat/')
        uses: actions/upload-artifact@v4
        with:
          name: visual-preview
          path: dist
          retention-days: 1
