name: Deploy GitHub Pages Preview

on:
  push:
    branches: [feat/authored-vertical-slice]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: preview-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build production root
        working-directory: main-src
        run: |
          npm install
          npm run build

      - name: Build preview subpath
        working-directory: preview-src
        run: |
          npm install
          npm run build -- --base=/The-WAR/preview/

      - name: Compose Pages artifact
        run: |
          mkdir -p site/preview
          cp -R main-src/dist/. site/
          cp -R preview-src/dist/. site/preview/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
